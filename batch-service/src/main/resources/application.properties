spring.application.name=batch-service
server.port=8084
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.continue-on-error=true

banco.batch.chunk-size=${BATCH_CHUNK_SIZE:100}
banco.batch.max-reintentos=${BATCH_MAX_REINTENTOS:3}
banco.batch.pool-size=${BATCH_POOL_SIZE:3}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.nombre=Procesamiento legacy Banco XYZ
info.app.jobs=transaccionesJob,interesesJob,cuentasAnualesJob

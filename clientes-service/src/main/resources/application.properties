spring.application.name=clientes-service
server.port=8083
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.nombre=Servicio de clientes Banco XYZ
info.app.funcion=Administracion de perfiles y datos personales

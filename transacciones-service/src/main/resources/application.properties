spring.application.name=transacciones-service
server.port=8082
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=transacciones-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
banco.kafka.topic.retiros=${KAFKA_RETIROS_TOPIC:banco.retiros}
banco.kafka.topic.pagos=${KAFKA_PAGOS_TOPIC:banco.pagos}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

backend.cuentas.url=${CUENTAS_SERVICE_URL:http://CUENTAS-SERVICE}

resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=10s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.nombre=Servicio de pagos y transacciones Banco XYZ
info.app.canal=backend
info.app.eventos=Consumidor de retiros y productor de eventos de pago
